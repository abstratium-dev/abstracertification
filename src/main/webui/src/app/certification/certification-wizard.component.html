<div class="wizard-container" *ngIf="!loading() && !error() && definition()">
  <wizard
    [definition]="definition()"
    [initialStepIndex]="initialStepIndex"
    [maxReachedEntryIndex]="maxReachedEntryIndex()"
    [initialChoiceSelections]="choiceSelections()"
    (submitAnswers)="onSubmitAnswers($event)"
    (viewOverview)="navigateToOverview()"
    (stepChange)="onStepChange($event)"
    (choiceSelectionsChange)="onChoiceSelectionsChange($event)"
    (submitFeedback)="onSubmitFeedback($event)"></wizard>
</div>

<div *ngIf="loading()" class="loading">
  <p>Loading certification...</p>
</div>

<div *ngIf="error()" class="error-message">
  <h2>Error</h2>
  <p>{{ error() }}</p>
</div>
