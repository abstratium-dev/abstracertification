<div class="module-list-container">
  <div class="module-list-header">
    <h1>Certification Modules</h1>
    <p class="description">Choose a certification module to begin your learning journey.</p>
  </div>

  <div class="modules-grid" *ngIf="!loading && !error && modules.length > 0">
    <div *ngFor="let module of modules" class="module-card" (click)="startModule(module.id)">
      <div class="module-icon">&#127942;</div>
      <h2 class="module-title">{{ module.title }}</h2>
      <p class="module-description">{{ module.description }}</p>
      <div class="module-meta">
        <span class="page-count">{{ module.pageCount }} pages</span>
        <button class="btn-primary btn-start">Start</button>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="!loading && !error && modules.length === 0">
    <p>No certification modules available.</p>
  </div>

  <div class="loading" *ngIf="loading">
    <p>Loading modules...</p>
  </div>

  <div class="error-message" *ngIf="error">
    <h2>Error</h2>
    <p>{{ error }}</p>
  </div>
</div>
